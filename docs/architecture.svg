<svg xmlns="http://www.w3.org/2000/svg" width="880" height="510" viewBox="0 0 880 510" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#6b7688"/></marker>
    <marker id="ac" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#5fd0de"/></marker>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#f0b866"/></marker>
  </defs>

  <rect width="880" height="510" rx="10" fill="#0b0d11"/>
  <rect x="0.5" y="0.5" width="879" height="509" rx="10" fill="none" stroke="#2b313d"/>

  <text x="28" y="38" font-size="13" font-weight="700" fill="#8a9bb4" letter-spacing="1.3">NO FRAMEWORK ON EITHER SIDE OF THE WIRE</text>
  <text x="852" y="38" font-size="11" font-family="SFMono-Regular,Menlo,monospace" fill="#5d6675" text-anchor="end">~21k lines · 351 tests</text>

  <!-- client -->
  <rect x="28" y="62" width="216" height="212" rx="9" fill="#12151b" stroke="#5fd0de" stroke-width="1.3"/>
  <rect x="42" y="54" width="76" height="16" fill="#0b0d11"/>
  <text x="50" y="66" font-size="10.5" font-weight="700" fill="#5fd0de">the client</text>
  <text x="46" y="90" font-size="9.5" fill="#8a9bb4">vanilla ES modules, served as-is</text>
  <text x="46" y="104" font-size="9.5" fill="#8a9bb4">— no bundler, no build step</text>
  <line x1="46" y1="116" x2="226" y2="116" stroke="#2b313d"/>
  <g font-size="9.5" font-family="SFMono-Regular,Menlo,monospace" fill="#7d8899">
    <text x="46" y="136">router/</text><text x="130" y="136" font-family="-apple-system,sans-serif" fill="#8a9bb4">hash routing</text>
    <text x="46" y="154">views/</text><text x="130" y="154" font-family="-apple-system,sans-serif" fill="#8a9bb4">23 screens</text>
    <text x="46" y="172">components/</text>
    <text x="46" y="190">state/</text><text x="130" y="190" font-family="-apple-system,sans-serif" fill="#8a9bb4">a shared store</text>
    <text x="46" y="208">services/</text><text x="130" y="208" font-family="-apple-system,sans-serif" fill="#8a9bb4">fetch wrappers</text>
  </g>
  <rect x="46" y="222" width="180" height="38" rx="5" fill="#0f1319" stroke="#39414f"/>
  <text x="56" y="239" font-size="9" fill="#f0b866">themes are contrast-checked</text>
  <text x="56" y="252" font-size="8.5" fill="#7d8899">a picked colour is nudged until it clears AA</text>

  <!-- server -->
  <rect x="288" y="62" width="252" height="212" rx="9" fill="#12151b" stroke="#7ddc8b" stroke-width="1.3"/>
  <rect x="302" y="54" width="86" height="16" fill="#0b0d11"/>
  <text x="310" y="66" font-size="10.5" font-weight="700" fill="#7ddc8b">the server</text>
  <text x="306" y="90" font-size="9.5" fill="#8a9bb4">Express, ES modules</text>
  <line x1="306" y1="102" x2="522" y2="102" stroke="#2b313d"/>

  <rect x="306" y="112" width="216" height="42" rx="6" fill="#0f1319" stroke="#39414f"/>
  <text x="316" y="128" font-size="9.5" font-weight="700" fill="#e6edf3">middleware</text>
  <text x="316" y="145" font-size="8.5" fill="#8a9bb4">JWT · zod · rate limit · RBAC · audit</text>

  <rect x="306" y="160" width="216" height="42" rx="6" fill="#0f1319" stroke="#39414f"/>
  <text x="316" y="176" font-size="9.5" font-weight="700" fill="#e6edf3">24 route modules</text>
  <text x="316" y="193" font-size="8.5" fill="#8a9bb4">tasks · forum · duels · store · review · …</text>

  <rect x="306" y="208" width="216" height="52" rx="6" fill="#0f1319" stroke="#a78bfa"/>
  <text x="316" y="224" font-size="9.5" font-weight="700" fill="#a78bfa">22 services</text>
  <text x="316" y="240" font-size="8.5" fill="#8a9bb4">where the rules live — routes stay thin,</text>
  <text x="316" y="252" font-size="8.5" fill="#8a9bb4">so a rule has exactly one home</text>

  <!-- data -->
  <rect x="584" y="62" width="268" height="212" rx="9" fill="#12151b" stroke="#f0b866" stroke-width="1.3"/>
  <rect x="598" y="54" width="70" height="16" fill="#0b0d11"/>
  <text x="606" y="66" font-size="10.5" font-weight="700" fill="#f0b866">the data</text>
  <text x="602" y="90" font-size="9.5" fill="#8a9bb4">SQLite via better-sqlite3 — synchronous,</text>
  <text x="602" y="104" font-size="9.5" fill="#8a9bb4">which is what makes transactions readable</text>
  <line x1="602" y1="116" x2="834" y2="116" stroke="#2b313d"/>
  <g font-size="9.5" fill="#8a9bb4">
    <text x="602" y="136">· 23 versioned migrations, with rollback</text>
    <text x="602" y="154">· 25 models, one per table</text>
    <text x="602" y="172">· FTS5 search index, kept current by triggers</text>
    <text x="602" y="190">· WAL mode</text>
  </g>
  <rect x="602" y="204" width="232" height="56" rx="5" fill="#0f1319" stroke="#39414f"/>
  <text x="612" y="221" font-size="9" font-weight="700" fill="#e6edf3">search respects visibility</text>
  <text x="612" y="236" font-size="8.5" fill="#8a9bb4">the index is filtered by the same rules as the</text>
  <text x="612" y="249" font-size="8.5" fill="#8a9bb4">API — a member never finds a teachers-only post</text>

  <line x1="244" y1="150" x2="283" y2="150" stroke="#6b7688" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="263" y="143" font-size="8" fill="#5d6675" text-anchor="middle">REST</text>
  <line x1="540" y1="150" x2="579" y2="150" stroke="#6b7688" stroke-width="1.4" marker-end="url(#a)"/>

  <path d="M414 274 V 294 H 136 V 278" stroke="#5fd0de" stroke-width="1.4" fill="none" marker-end="url(#ac)"/>
  <text x="440" y="312" font-size="9" fill="#5fd0de" text-anchor="middle">SSE — messages, reactions, notifications, presence · no WebSocket anywhere</text>

  <!-- the ledger -->
  <line x1="28" y1="322" x2="852" y2="322" stroke="#2b313d"/>
  <text x="28" y="346" font-size="12" font-weight="700" fill="#8a9bb4" letter-spacing="1.1">THE RULE THE WHOLE ECONOMY RESTS ON</text>

  <rect x="28" y="358" width="266" height="124" rx="8" fill="#12151b" stroke="#39414f" stroke-width="1.2"/>
  <text x="44" y="380" font-size="10.5" font-weight="700" fill="#e6edf3">balances are never stored</text>
  <text x="44" y="400" font-size="9.5" fill="#8a9bb4">Every balance is summed from signed</text>
  <text x="44" y="414" font-size="9.5" fill="#8a9bb4">ledger rows on read, never kept as a</text>
  <text x="44" y="428" font-size="9.5" fill="#8a9bb4">column. A crash mid-purchase cannot</text>
  <text x="44" y="442" font-size="9.5" fill="#8a9bb4">leave an item without its debit, because</text>
  <text x="44" y="456" font-size="9.5" fill="#8a9bb4">there is no second number to fall out</text>
  <text x="44" y="470" font-size="9.5" fill="#8a9bb4">of step with the first.</text>

  <rect x="308" y="358" width="266" height="124" rx="8" fill="#12151b" stroke="#39414f" stroke-width="1.2"/>
  <text x="324" y="380" font-size="10.5" font-weight="700" fill="#e6edf3">the check and the debit are one</text>
  <text x="324" y="400" font-size="9.5" fill="#8a9bb4">"can they afford it?" and "take payment"</text>
  <text x="324" y="414" font-size="9.5" fill="#8a9bb4">run inside a single transaction. Split them</text>
  <text x="324" y="428" font-size="9.5" fill="#8a9bb4">and two requests arriving together both</text>
  <text x="324" y="442" font-size="9.5" fill="#8a9bb4">read the old balance and both succeed —</text>
  <text x="324" y="456" font-size="9.5" fill="#8a9bb4">the classic way a wallet goes negative</text>
  <text x="324" y="470" font-size="9.5" fill="#8a9bb4">without a single bug in the arithmetic.</text>

  <rect x="588" y="358" width="264" height="124" rx="8" fill="#12151b" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="604" y="380" font-size="10.5" font-weight="700" fill="#a78bfa">duels mint nothing</text>
  <text x="604" y="400" font-size="9.5" fill="#8a9bb4">Both stakes are escrowed as ledger rows</text>
  <text x="604" y="414" font-size="9.5" fill="#8a9bb4">the moment each side commits, refunded</text>
  <text x="604" y="428" font-size="9.5" fill="#8a9bb4">in full on a decline, and paid out whole to</text>
  <text x="604" y="442" font-size="9.5" fill="#8a9bb4">the declared winner.</text>
  <text x="604" y="462" font-size="9.5" font-weight="600" fill="#7ddc8b">Two stakes in, two stakes out.</text>

  <line x1="28" y1="494" x2="852" y2="494" stroke="#2b313d"/>
</svg>
