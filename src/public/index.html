<!DOCTYPE html>
<html class="dark" data-theme="dark" lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <meta name="color-scheme" content="dark" />
  <title>Forge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script>
    /* Compatibility shim: views still carrying utility classes resolve against
       the same tokens forge.css defines, so both systems stay in step while
       views are converted. */
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'royal-slate-blue': 'var(--accent)',
            'accent-text': 'var(--accent-text)',
            primary: 'var(--accent)',
            'ice-blue': 'var(--accent-text)',
            outline: 'var(--text-muted)',
            'deep-obsidian': 'var(--bg)',
            'on-surface': 'var(--text)',
            'surface-variant': 'var(--bg-elevated)'
          },
          fontFamily: { display: ['Inter', 'sans-serif'], body: ['Inter', 'sans-serif'] }
        }
      }
    };
  </script>
  <!-- Legacy component styles load first; the design system loads last so it
       wins on equal specificity while old views are converted. -->
  <link href="/css/style.css" rel="stylesheet" />
  <link href="/css/forge.css" rel="stylesheet" />
  <style>
    /* Legacy alias so unconverted views inherit the new card treatment. */
    .glass-card { }
  </style>
</head>
<body>

  <div class="backdrop" id="drawerBackdrop" data-open="false"></div>

  <aside class="sidebar" id="sidebarDrawer" aria-label="Main navigation" data-open="false">
    <div class="sidebar__brand">
      <img src="/assets/logo/FULL.png" alt="Forge" style="height:26px;width:auto" />
      <button class="btn btn--icon btn--subtle" id="drawerCloseBtn" aria-label="Close menu">
        <span class="material-symbols-outlined" aria-hidden="true">close</span>
      </button>
    </div>

    <nav class="sidebar__nav" id="drawerNavList">
        <div class="nav-group" data-nav-group="work">
          <button type="button" class="nav-group__toggle" aria-expanded="true" aria-controls="navGroup-work">
            <span class="material-symbols-outlined nav-group__chevron" aria-hidden="true">expand_more</span>
            <span>Work</span>
          </button>
          <div class="nav-group__items" id="navGroup-work">
          <button class="nav-item" data-tab="dashboard">
            <span class="material-symbols-outlined" aria-hidden="true">dashboard</span>
            <span>Dashboard</span>
          </button>
          <button class="nav-item" data-tab="tasks">
            <span class="material-symbols-outlined" aria-hidden="true">assignment</span>
            <span>Tasks</span>
          </button>
          <button class="nav-item" data-tab="teams">
            <span class="material-symbols-outlined" aria-hidden="true">groups</span>
            <span>Teams</span>
          </button>
          <button class="nav-item" data-tab="calendar">
            <span class="material-symbols-outlined" aria-hidden="true">calendar_month</span>
            <span>Calendar</span>
          </button>
          </div>
        </div>
        <div class="nav-group" data-nav-group="community">
          <button type="button" class="nav-group__toggle" aria-expanded="true" aria-controls="navGroup-community">
            <span class="material-symbols-outlined nav-group__chevron" aria-hidden="true">expand_more</span>
            <span>Community</span>
          </button>
          <div class="nav-group__items" id="navGroup-community">
          <button class="nav-item" data-tab="messages">
            <span class="material-symbols-outlined" aria-hidden="true">forum</span>
            <span>Messages</span>
            <span class="nav-item__count hidden" id="navUnreadChannels"></span>
          </button>
          <button class="nav-item" data-tab="announcements">
            <span class="material-symbols-outlined" aria-hidden="true">campaign</span>
            <span>Announcements</span>
          </button>
          <button class="nav-item" data-tab="forum">
            <span class="material-symbols-outlined" aria-hidden="true">tips_and_updates</span>
            <span>Forum</span>
          </button>
          <button class="nav-item" data-tab="marketplace">
            <span class="material-symbols-outlined" aria-hidden="true">storefront</span>
            <span>Marketplace</span>
          </button>
          </div>
        </div>
        <div class="nav-group" data-nav-group="growth">
          <button type="button" class="nav-group__toggle" aria-expanded="true" aria-controls="navGroup-growth">
            <span class="material-symbols-outlined nav-group__chevron" aria-hidden="true">expand_more</span>
            <span>Growth</span>
          </button>
          <div class="nav-group__items" id="navGroup-growth">
          <button class="nav-item" data-tab="profile">
            <span class="material-symbols-outlined" aria-hidden="true">military_tech</span>
            <span>My Progress</span>
          </button>
          <button class="nav-item" data-tab="quizzes">
            <span class="material-symbols-outlined" aria-hidden="true">quiz</span>
            <span>Quizzes</span>
          </button>
          <button class="nav-item" data-tab="halloffame">
            <span class="material-symbols-outlined" aria-hidden="true">emoji_events</span>
            <span>Hall of Fame</span>
          </button>
          <button class="nav-item" data-tab="journal">
            <span class="material-symbols-outlined" aria-hidden="true">menu_book</span>
            <span>Journal</span>
          </button>
          </div>
        </div>
        <div class="nav-group" data-nav-group="manage" data-nav-roles="leader,teacher,admin,DEV_STEALTH,STUDENT_LEADER,TEACHER">
          <button type="button" class="nav-group__toggle" aria-expanded="false" aria-controls="navGroup-manage">
            <span class="material-symbols-outlined nav-group__chevron" aria-hidden="true">chevron_right</span>
            <span>Manage</span>
          </button>
          <div class="nav-group__items hidden" id="navGroup-manage">
          <button class="nav-item" data-tab="review">
            <span class="material-symbols-outlined" aria-hidden="true">rate_review</span>
            <span>Review</span>
          </button>
          <button class="nav-item" data-tab="analytics">
            <span class="material-symbols-outlined" aria-hidden="true">insights</span>
            <span>Analytics</span>
          </button>
          <button class="nav-item" data-tab="devdashboard">
            <span class="material-symbols-outlined" aria-hidden="true">admin_panel_settings</span>
            <span>Dev Dashboard</span>
          </button>
          <button class="nav-item" data-tab="componentstest">
            <span class="material-symbols-outlined" aria-hidden="true">widgets</span>
            <span>Components</span>
          </button>
          </div>
        </div>
      <div class="nav-group">
        <div class="nav-group__items">
          <button class="nav-item" data-tab="appearance">
            <span class="material-symbols-outlined" aria-hidden="true">palette</span><span>Appearance</span>
          </button>
          <button class="nav-item" id="drawerSettingsLink" data-tab="settings">
            <span class="material-symbols-outlined" aria-hidden="true">settings</span><span>Settings</span>
          </button>
          <button class="nav-item hidden" id="drawerLoginLink" data-tab="login">
            <span class="material-symbols-outlined" aria-hidden="true">login</span><span>Sign in</span>
          </button>
          <button class="nav-item hidden" id="drawerSignUpLink" data-tab="signup">
            <span class="material-symbols-outlined" aria-hidden="true">person_add</span><span>Create account</span>
          </button>
        </div>
      </div>
    </nav>

    <div class="sidebar__foot">
      <div class="row row--tight">
        <span class="avatar" id="sidebarAvatar">?</span>
        <span class="col" style="gap:0;min-width:0;flex:1">
          <span class="truncate" id="drawerUserName" style="font-size:.8125rem;font-weight:600">Guest</span>
          <span class="truncate text-faint" id="drawerUserTag" style="font-size:.6875rem">Not signed in</span>
        </span>
        <button class="btn btn--icon btn--subtle hidden" id="drawerLogoutBtn" aria-label="Sign out" title="Sign out">
          <span class="material-symbols-outlined" aria-hidden="true">logout</span>
        </button>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="btn btn--icon btn--subtle" id="drawerToggleBtn" aria-label="Open menu"
        aria-controls="sidebarDrawer" aria-expanded="false" style="display:inline-flex">
        <span class="material-symbols-outlined" aria-hidden="true">menu</span>
      </button>

      <span class="spacer"></span>

      <button class="btn btn--ghost btn--sm" id="btnOpenPalette" aria-label="Search" title="Search (Cmd K)">
        <span class="material-symbols-outlined" style="font-size:18px" aria-hidden="true">search</span>
        <span class="text-faint" style="font-weight:500">Search</span>
      </button>

      <div style="position:relative" id="notificationBellContainer">
        <button class="btn btn--icon btn--ghost" id="notificationBellBtn" aria-label="Notifications"
          aria-haspopup="true" aria-expanded="false" style="position:relative">
          <span class="material-symbols-outlined" aria-hidden="true">notifications</span>
          <span id="notificationUnreadBadge" class="nav-item__count"
            style="position:absolute;top:-4px;right:-4px;background:var(--danger);transform:scale(0);transition:transform .2s">0</span>
        </button>

        <div id="notificationDropdownPanel" class="forge-notification-dropdown">
          <div class="card__header" style="justify-content:space-between">
            <span class="eyebrow">Notifications</span>
            <button class="btn btn--sm btn--subtle" id="markAllReadBtn">Mark all read</button>
          </div>
          <div id="notificationListContainer" style="max-height:20rem;overflow-y:auto">
            <div class="empty" style="padding:var(--sp-8)"><span class="empty__text">Loading…</span></div>
          </div>
          <div class="row row--tight" style="justify-content:center;padding:var(--sp-2);border-top:1px solid var(--line-faint)">
            <span style="width:6px;height:6px;border-radius:999px;background:var(--success)"></span>
            <span class="text-faint" style="font-size:.6875rem">Live</span>
          </div>
        </div>
      </div>

      <div class="row row--tight" id="currentUserBadge">
        <span class="text-muted truncate" id="userTagBadge" style="font-size:.75rem;max-width:16ch"></span>
        <span class="avatar avatar--sm" id="topbarAvatar">?</span>
      </div>
    </header>

    <main class="page" id="appView"></main>

    <footer class="row" style="padding:var(--sp-5) var(--sp-8);border-top:1px solid var(--line-faint);font-size:.75rem;color:var(--text-faint)">
      <span>Forge</span>
      <span class="chip">v1.0</span>
      <span class="spacer"></span>
      <span id="footerAccount"></span>
    </footer>
  </div>

  <div id="forgeLiveRegion" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
